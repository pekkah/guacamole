name: Publish

# Builds, tests, packs and publishes to nuget.org.
#
# Triggers:
#   - push to main         -> X.Y.Z-preview.N (GitVersion SemVer), nuget.org only, no GitHub release
#   - push of a tag vX.Y.Z -> X.Y.Z (tag without "v"), nuget.org + GitHub release
#                             Tags must be stable; v1.2.3-beta.1 etc. are rejected and not published.
#   - manual run (workflow_dispatch) on main or a v* tag: re-runs the same publish for that
#     ref (e.g. after fixing the nuget.org policy). Any other ref is refused.
#
# CI is reused, not duplicated: the build job calls ci.yml (workflow_call), so the full
# test matrix runs once per push and nothing is published unless it passes. ci.yml has
# no push trigger of its own; pull requests are built by ci.yml alone and never published.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time per ref; an in-progress publish is never cancelled. GitHub keeps
# at most one *pending* run per group, so with several quick pushes to main an older
# pending run may be replaced by the newest one; that only skips an intermediate preview.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  guard:
    name: Check ref
    runs-on: ubuntu-latest
    steps:
      # Fails fast, before the test matrix. ci.yml repeats the stable-tag check when it
      # computes the version, so a tag build can never pack a prerelease version.
      - name: Only main or stable v* tags may publish
        shell: bash
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then exit 0; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            stable_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
            if [[ "$GITHUB_REF_NAME" =~ $stable_re ]]; then exit 0; fi
            echo "::error::Tag '$GITHUB_REF_NAME' is not a stable version. Release tags must be vMAJOR.MINOR.PATCH (e.g. v1.2.3); prerelease packages are published automatically from main as X.Y.Z-preview.N. Delete the tag; nothing was published."
            exit 1
          fi
          echo "::error::Publishing is only allowed from main or a v* tag (got $GITHUB_REF)"
          exit 1

  # Same test matrix + pack as CI, reused instead of duplicated.
  build:
    name: Build
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: build
    # A main build is always a preview (X.Y.Z-preview.N), except when main's HEAD already
    # carries a release tag (commit and tag pushed together): GitVersion then reports the
    # stable X.Y.Z, and that version is left to the tag's own run, which also creates the
    # GitHub release.
    if: github.ref_type == 'tag' || needs.build.outputs.prerelease == 'true'
    permissions:
      contents: write  # gh release create (tags only)
      id-token: write  # OIDC token for NuGet trusted publishing

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Show version
        run: |
          echo "Version:    ${{ needs.build.outputs.version }}"
          echo "Prerelease: ${{ needs.build.outputs.prerelease }}"
          ls -l artifacts/

      # Only the version check script is needed from the repository.
      - name: Checkout version check script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: repo

      # Every new package must sort above all versions already on nuget.org (listed or
      # unlisted, e.g. the old 0.1.0-alpha.23 ... 0.1.0-alpha.41), using NuGet's SemVer 2.0
      # ordering. The script first runs its own ordering self-test. A version that already
      # exists for a package passes: that is a re-run, and --skip-duplicate skips it below.
      # 404 from nuget.org (package has no versions yet) passes as well.
      - name: Check version is higher than nuget.org
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          script=repo/.github/scripts/check_nuget_version.py
          python3 -I "$script" --self-test

          ids=()
          for f in artifacts/*.nupkg; do
            name="$(basename "$f")"
            id="${name%".$VERSION.nupkg"}"
            if [ "$id" = "$name" ]; then
              echo "::error::$name does not have the expected version $VERSION"
              exit 1
            fi
            ids+=("$id")
          done
          if [ "${#ids[@]}" -eq 0 ]; then
            echo "::error::No .nupkg files in artifacts/"
            exit 1
          fi

          python3 -I "$script" "$VERSION" "${ids[@]}"

      # .snupkg files next to the .nupkg are pushed to the symbol server automatically.
      # --skip-duplicate makes re-runs idempotent; versions never contain build metadata
      # and preview numbers grow with every commit on main, so distinct commits never
      # collapse to the same version.
      # Trusted publishing: exchange the workflow's OIDC token for a short-lived
      # (1 hour) nuget.org API key. No long-lived NUGET_API_KEY secret is stored.
      # Requires a trusted publishing policy on nuget.org for this repo + publish.yml with
      # no environment, which covers runs from main and from tags alike.
      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org username that owns the trusted publishing policy

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.nupkg artifacts/*.snupkg)

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; re-uploading assets"
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          # Tag versions are always stable (ci.yml rejects prerelease tags), so this is
          # a normal release that becomes "Latest".
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes --verify-tag
