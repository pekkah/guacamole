name: Publish

# Publishes to nuget.org and creates a GitHub release.
#
# Triggers:
#   - push of a version tag  v1.2.3 / v1.2.3-beta.1  -> package version = tag without "v"
#   - manual run (workflow_dispatch), only from main or a v* tag.
#       * on a tag:  same as a tag push
#       * on main:   publishes the current GitVersion prerelease (e.g. 0.2.0-alpha.5)
#                    to nuget.org; no GitHub release is created (there is no tag)
#
# Plain pushes to main do NOT publish; ci.yml builds, tests and packs them.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  guard:
    name: Check ref
    runs-on: ubuntu-latest
    steps:
      - name: Only main or v* tags may publish
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then exit 0; fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then exit 0; fi
          echo "::error::Publishing is only allowed from main or a v* tag (got $GITHUB_REF)"
          exit 1

  # Same test matrix + pack as CI, reused instead of duplicated.
  build:
    name: Build
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write  # gh release create

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Show version
        run: |
          echo "Version:    ${{ needs.build.outputs.version }}"
          echo "Prerelease: ${{ needs.build.outputs.prerelease }}"
          ls -l artifacts/

      # .snupkg files next to the .nupkg are pushed to the symbol server automatically.
      # --skip-duplicate only makes re-runs of the same tag idempotent; versions never
      # contain build metadata, so distinct commits never collapse to the same version.
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.nupkg artifacts/*.snupkg)

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; re-uploading assets"
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          flags=(--repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${files[@]}" "${flags[@]}"
